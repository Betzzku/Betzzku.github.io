<body>

     <!-- HEADER -->
    <header class="topnav" id="topnav">
        <div class="topnav-inner">
            <a class="brand" href="index.html"><span class="brand-prompt">$</span> petteri</a>

            <nav class="nav-links" id="navLinks">

                <a target="_blank" rel="noopener" href="https://github.com/Betzzku">GitHub</a>

                <span></span><span></span><span></span>
            </button>
        </div>
    </header>
    
    
    <div class="form-container">
        <p class="eyebrow">$ contact-form</p>
        <h2 class="h2-titles">Contact me</h2>
        <p class="subtitle">Drop me a message below!</p>
    
        <form action="https://formspree.io/f/xlgbjkne" method="POST">
            <div class="form-insider">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
            </div>
            <textarea class="message" name="message" placeholder="Write your message here..." required></textarea>
            <button class="btn btn-submit" type="submit">
                <span>Send</span>
            </button>
        </form>
    </div>
    
</body>
<script src="index.js"></script>
