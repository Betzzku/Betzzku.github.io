<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Contact</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='every.css'>
    <style>
        * {
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px 10px;
            font-size: 3rem;
            font-weight: 700;
            color: #2ecc71;
            cursor: pointer;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        h1:hover {
            color: #27ae60;
            transform: scale(1.05);
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.15);
        }

        .subtitle {
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .tiedot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .Viesti {
            width: 700px;
            max-width: 90%;
            min-height: 280px;
            max-height: 500px;
            
            overflow: auto;
            white-space: pre-wrap;
            border: 2px solid #e0e0e0;
            padding: 20px;
            font-size: 18px;
            line-height: 1.6;
            border-radius: 15px;
            resize: vertical;
            word-wrap: break-word;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        .Viesti::placeholder {
            color: #aaa;
            font-size: 18px;
        }

        .button {
            color: #fff;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            border: none;
            width: 350px;
            height: 65px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
            margin-top: 20px;
        }
        
        .button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(46, 204, 113, 0.5);
            background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%);
        }

        .button:active {
            transform: translateY(-2px) scale(1.02);
        }

        .laatikot {
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 30px;
            border: none;
            background: linear-gradient(145deg, #ffffff 0%, #f8f9fa 100%);

            min-height: 750px;
            width: 900px;
            max-width: 95vw;
            padding: 50px 40px;
            
            margin: 120px auto 50px auto;

            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.12),
                0 10px 20px rgba(0, 0, 0, 0.08);
        }

        .laatikot:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 
                0 35px 80px rgba(0, 0, 0, 0.15),
                0 15px 30px rgba(0, 0, 0, 0.1);
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #ffffff, #e8f5e9, #f1f8e9, #ffffff);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            padding-bottom: 50px;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        input[type="text"], input[type="email"] {
            height: 60px;
            width: 500px;
            max-width: 90%;
            border-radius: 15px;
            border: 2px solid #e0e0e0;
            background-color: #fafafa;
            padding: 0 25px;
            font-size: 18px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder, input[type="email"]::placeholder {
            color: #aaa;
            font-size: 18px;
        }

        textarea:focus {
            outline: none;
            border: 2px solid #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.25);
            background-color: #fff;
        }

        input[type="text"]:focus, input[type="email"]:focus {
            outline: none;
            border: 2px solid #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.25);
            background-color: #fff;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Decorative elements */
        .decoration {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.1), rgba(39, 174, 96, 0.05));
            z-index: -1;
        }

        /* Mobile Responsive Design for Contact Page */
        @media screen and (max-width: 768px) {
            .laatikot {
                width: 95vw;
                margin: 100px auto 30px auto;
                min-height: auto;
                padding: 40px 25px;
                border-radius: 25px;
            }
            
            .laatikot:hover {
                transform: translateY(-5px) scale(1.01);
            }
            
            h1 {
                font-size: 2.2rem;
                padding: 20px 10px;
            }

            .subtitle {
                font-size: 1rem;
                margin-bottom: 30px;
            }
            
            .Viesti {
                width: 100%;
                min-width: 280px;
                max-width: 100%;
                min-height: 200px;
                font-size: 16px;
                padding: 15px;
            }
            
            input[type="text"], input[type="email"] {
                width: 100%;
                max-width: 400px;
                height: 55px;
                font-size: 16px;
            }
            
            .button {
                width: 100%;
                max-width: 300px;
                height: 60px;
                font-size: 1.1rem;
            }
        }

        @media screen and (max-width: 480px) {
            .laatikot {
                width: 98vw;
                margin: 80px auto 20px auto;
                padding: 30px 20px;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 0.9rem;
            }
            
            input[type="text"], input[type="email"] {
                width: 100%;
                max-width: 100%;
                height: 50px;
                font-size: 16px;
                padding: 0 15px;
            }
            
            .Viesti {
                width: 100%;
                min-width: auto;
                min-height: 180px;
                font-size: 16px;
            }
            
            .button {
                width: 100%;
                height: 55px;
                font-size: 1rem;
            }

            .tiedot {
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    </div>

        <a href="index.html">Front page</a>
        <a href="tietoa.html">Info</a>
        <a class="active" href="yhteitieto.html">Contact me</a>
        <a target="_blank" href="https://github.com/Betzzku">GitHub</a>
        <a target="_blank" href="https://steamcommunity.com/id/Betzzku">Steam</a>
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    </div>
    
    
    <div class="laatikot">
        <h1>Contact me</h1>
        <p class="subtitle">I'd love to hear from you! Drop me a message below.</p>
    
        <form  action="https://formspree.io/f/xlgbjkne" method="POST">
            <div class="tiedot">
                <input type="text" name="Nimi" placeholder="Your Name" required>
                <input type="email" name="Sähkoposti" placeholder="Your Email" required>
            </div>
            <textarea class="Viesti" name="Viesti" placeholder="Write your message here..." required></textarea>
            <button class="button" type="submit">Send Message</button>
        </form>
    </div>
    
</body>
<script>
    function openNav() {
        document.getElementById("mySidenav").style.width = "250px";
    }
    function closeNav() {
        document.getElementById("mySidenav").style.width = "0";
    }

// Oletetaan että sinulla on <form> ja .button on submit-nappi
    const form = document.querySelector('form');
    const sendBtn = form.querySelector('button[type="submit"]');
</script>
</html>
